<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#38b7a5">

  <title>陪伴機器人</title>

  <style>

    /* =====================================================
       基本設定
    ===================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;

      overflow: hidden;

      background: #000;

      font-family:
        Arial,
        "Noto Sans TC",
        sans-serif;
    }

    body {
      width: 100vw;
      height: 100vh;

      width: 100dvw;
      height: 100dvh;
    }


    /* =====================================================
       機器人面部
       100% 全螢幕
    ===================================================== */

    #robot {

      position: fixed;

      left: 0;
      top: 0;

      width: 100vw;
      height: 100vh;

      width: 100dvw;
      height: 100dvh;

      overflow: hidden;

      background: #38b7a5;

      border: 0;

      border-radius: 0;

      box-shadow: none;

      transition:
        background-color 300ms ease;
    }


    /* =====================================================
       頂部指示燈
    ===================================================== */

    .status-light {

      position: absolute;

      top: 3.5%;
      left: 50%;

      width: clamp(10px, 2vw, 24px);
      height: clamp(10px, 2vw, 24px);

      transform: translateX(-50%);

      border-radius: 50%;

      background: #d8fff8;

      box-shadow:
        0 0 20px rgba(216, 255, 248, 0.9);

      animation:
        lightPulse 2.2s ease-in-out infinite;

      z-index: 10;
    }


    @keyframes lightPulse {

      0%,
      100% {
        opacity: 0.55;

        transform:
          translateX(-50%)
          scale(0.85);
      }

      50% {
        opacity: 1;

        transform:
          translateX(-50%)
          scale(1.15);
      }

    }


    /* =====================================================
       眼睛區域
    ===================================================== */

    .eyes {

      position: absolute;

      left: 50%;
      top: 28%;

      width: 62%;
      height: 26%;

      transform: translateX(-50%);

      display: flex;

      justify-content: space-between;
      align-items: center;
    }


    /* =====================================================
       眼睛
    ===================================================== */

    .eye {

      width: 19%;
      height: 78%;

      background: #102c2d;

      border-radius: 38%;

      transform-origin: center;

      transition:
        width 220ms ease,
        height 220ms ease,
        border-radius 220ms ease,
        transform 220ms ease;
    }


    /* =====================================================
       眨眼
    ===================================================== */

    #robot.blinking .eye {

      height: 8%;

      border-radius: 999px;
    }


    /* =====================================================
       嘴巴區域
    ===================================================== */

    .mouth-area {

      position: absolute;

      left: 50%;
      top: 59%;

      width: 36%;
      height: 25%;

      transform: translateX(-50%);

      display: flex;

      justify-content: center;
      align-items: center;
    }


    /* =====================================================
       嘴巴
    ===================================================== */

    #mouth {

      width: 52%;
      height: 8%;

      background: #102c2d;

      border-radius: 999px;

      transform-origin: center;

      transition:
        width 220ms ease,
        height 220ms ease,
        border 220ms ease,
        border-radius 220ms ease,
        transform 120ms ease;
    }


    /* =====================================================
       NEUTRAL
    ===================================================== */

    #robot.neutral #mouth {

      width: 52%;
      height: 8%;

      background: #102c2d;

      border: 0;

      border-radius: 999px;
    }


    /* =====================================================
       HAPPY
    ===================================================== */

    #robot.happy .eye {

      height: 38%;

      border-radius: 999px;
    }


    #robot.happy .eye.left {

      transform: rotate(10deg);
    }


    #robot.happy .eye.right {

      transform: rotate(-10deg);
    }


    #robot.happy #mouth {

      width: 60%;
      height: 40%;

      background: transparent;

      border: clamp(4px, 0.7vw, 9px)
        solid #102c2d;

      border-top: 0;

      border-radius:
        0 0 999px 999px;
    }


    /* =====================================================
       SAD
    ===================================================== */

    #robot.sad .eye.left {

      transform: rotate(18deg);
    }


    #robot.sad .eye.right {

      transform: rotate(-18deg);
    }


    #robot.sad #mouth {

      width: 55%;
      height: 34%;

      background: transparent;

      border: clamp(4px, 0.7vw, 9px)
        solid #102c2d;

      border-bottom: 0;

      border-radius:
        999px 999px 0 0;
    }


    /* =====================================================
       ANGRY
    ===================================================== */

    #robot.angry .eye.left {

      transform: rotate(-18deg);
    }


    #robot.angry .eye.right {

      transform: rotate(18deg);
    }


    #robot.angry #mouth {

      width: 55%;
      height: 22%;

      background: transparent;

      border:
        clamp(4px, 0.7vw, 9px)
        solid #102c2d;

      border-radius: 25px;
    }


    /* =====================================================
       SURPRISED
    ===================================================== */

    #robot.surprised .eye {

      width: 24%;
      height: 90%;

      border-radius: 50%;
    }


    #robot.surprised #mouth {

      width: 25%;
      height: 48%;

      background: transparent;

      border:
        clamp(4px, 0.7vw, 9px)
        solid #102c2d;

      border-radius: 50%;
    }


    /* =====================================================
       THINKING
    ===================================================== */

    #robot.thinking .eye {

      animation:
        thinkingEyes
        1.5s
        ease-in-out
        infinite;
    }


    #robot.thinking #mouth {

      width: 35%;
      height: 20%;

      background: transparent;

      border:
        clamp(4px, 0.7vw, 9px)
        solid #102c2d;

      border-radius: 50%;
    }


    @keyframes thinkingEyes {

      0%,
      100% {
        transform: translateX(0);
      }

      50% {
        transform: translateX(12px);
      }

    }


    /* =====================================================
       LISTENING
    ===================================================== */

    #robot.listening .eye {

      animation:
        listeningPulse
        900ms
        ease-in-out
        infinite
        alternate;
    }


    @keyframes listeningPulse {

      from {
        transform: scale(0.93);
      }

      to {
        transform: scale(1.07);
      }

    }


    /* =====================================================
       SLEEPY
    ===================================================== */

    #robot.sleepy .eye {

      height: 10%;

      border-radius: 999px;
    }


    #robot.sleepy #mouth {

      width: 38%;
      height: 7%;

      background: #102c2d;

      border: 0;

      border-radius: 999px;
    }


    /* =====================================================
       嘴巴說話動畫
    ===================================================== */

    #robot.speaking #mouth {

      animation:
        mouthTalk
        180ms
        ease-in-out
        infinite
        alternate;
    }


    @keyframes mouthTalk {

      from {

        transform:
          scale(0.82, 0.65);
      }

      to {

        transform:
          scale(1.08, 1.15);
      }

    }


    /* =====================================================
       說話時眼睛輕微動
    ===================================================== */

    #robot.speaking .eye {

      animation:
        speakingEyes
        1.8s
        ease-in-out
        infinite;
    }


    @keyframes speakingEyes {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-2px);
      }

    }


    /* =====================================================
       手機 / 平板 / 電腦全部全螢幕
    ===================================================== */

    @media screen {

      html,
      body,
      #robot {

        width: 100vw;
        height: 100vh;

        width: 100dvw;
        height: 100dvh;
      }

    }


    /* =====================================================
       減少動畫設定
    ===================================================== */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {

        animation: none !important;

        transition: none !important;
      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       機器人臉
  ===================================================== -->

  <main
    id="robot"
    class="neutral"
    aria-label="陪伴機器人"
  >


    <!-- 眼睛 -->

    <div
      class="eyes"
      aria-hidden="true"
    >

      <div class="eye left"></div>

      <div class="eye right"></div>

    </div>


    <!-- 嘴巴 -->

    <div
      class="mouth-area"
      aria-hidden="true"
    >

      <div id="mouth"></div>

    </div>


  </main>


  <script>

    "use strict";


    /* =====================================================
       DOM
    ===================================================== */

    const robot =
      document.getElementById("robot");


    /* =====================================================
       Gemini 可以使用的表情
    ===================================================== */

    const EMOTIONS = [

      "neutral",
      "happy",
      "sad",
      "angry",
      "surprised",
      "thinking",
      "listening",
      "sleepy"

    ];


    let currentEmotion =
      "neutral";


    let isSpeaking =
      false;


    let blinkTimer =
      null;


    let blinkInProgress =
      false;


    /* =====================================================
       改變表情
       
       Gemini 之後可以直接：

       setEmotion("happy");

       setEmotion("sad");

       setEmotion("thinking");
    ===================================================== */

    function setEmotion(emotion) {

      if (
        typeof emotion !== "string"
      ) {

        emotion = "neutral";
      }


      emotion =
        emotion
          .toLowerCase()
          .trim();


      if (
        !EMOTIONS.includes(emotion)
      ) {

        emotion = "neutral";
      }


      /* 移除舊表情 */

      EMOTIONS.forEach(
        (name) => {

          robot.classList.remove(
            name
          );

        }
      );


      /* 套用新表情 */

      robot.classList.add(
        emotion
      );


      /* 記錄目前表情 */

      currentEmotion =
        emotion;
    }


    /* =====================================================
       控制說話嘴巴

       true：
       開始說話

       false：
       停止說話
    ===================================================== */

    function setSpeaking(speaking) {

      isSpeaking =
        Boolean(speaking);


      robot.classList.toggle(
        "speaking",
        isSpeaking
      );
    }


    /* =====================================================
       眨眼
    ===================================================== */

    function blink() {

      if (
        blinkInProgress
      ) {

        return;
      }


      blinkInProgress =
        true;


      robot.classList.add(
        "blinking"
      );


      window.setTimeout(
        () => {

          robot.classList.remove(
            "blinking"
          );


          blinkInProgress =
            false;

        },
        170
      );
    }


    /* =====================================================
       自動眨眼
    ===================================================== */

    function scheduleBlink() {

      const delay =
        2500 +
        Math.random() * 3500;


      blinkTimer =
        window.setTimeout(
          () => {


            if (
              !isSpeaking &&
              currentEmotion !==
              "sleepy"
            ) {

              blink();
            }


            scheduleBlink();


          },
          delay
        );
    }


    /* =====================================================
       Gemini 回覆

       Gemini 之後回傳：

       {
         "reply": "太棒了！",
         "emotion": "happy"
       }

       就可以：

       receiveGeminiResponse(data);
    ===================================================== */

    function receiveGeminiResponse(data) {

      if (
        !data ||
        typeof data !== "object"
      ) {

        return;
      }


      /* 取得 Gemini 的情緒 */

      if (
        typeof data.emotion ===
        "string"
      ) {

        setEmotion(
          data.emotion
        );
      }


      /* 取得 Gemini 的文字 */

      if (
        typeof data.reply ===
        "string"
      ) {

        console.log(
          "Gemini：",
          data.reply
        );
      }


      /* 如果同時收到 speaking */

      if (
        typeof data.speaking ===
        "boolean"
      ) {

        setSpeaking(
          data.speaking
        );
      }

    }


    /* =====================================================
       ESP32 / WebSocket 控制介面

       之後 ESP32 可以讓網站執行：

       robotControl({
         emotion: "happy",
         speaking: true
       });
    ===================================================== */

    window.robotControl =
      function(data) {

        if (
          !data ||
          typeof data !== "object"
        ) {

          return;
        }


        /* 表情 */

        if (
          typeof data.emotion ===
          "string"
        ) {

          setEmotion(
            data.emotion
          );
        }


        /* 嘴巴 */

        if (
          typeof data.speaking ===
          "boolean"
        ) {

          setSpeaking(
            data.speaking
          );
        }

      };


    /* =====================================================
       初始化
    ===================================================== */

    setEmotion("neutral");

    setSpeaking(false);

    scheduleBlink();


    /* =====================================================
       清除計時器
    ===================================================== */

    window.addEventListener(
      "beforeunload",
      () => {

        if (
          blinkTimer !== null
        ) {

          window.clearTimeout(
            blinkTimer
          );

        }

      }
    );

  </script>

</body>

</html>
