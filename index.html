<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMO Face Web Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #80ceb9; /* BMO 經典青綠色背景 */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        canvas {
            background-color: #80ceb9;
        }
    </style>
</head>
<body>

<canvas id="bmoCanvas"></canvas>

<script>
    const canvas = document.getElementById('bmoCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 核心狀態管理
    let state = {
        isBlinking: false,
        expression: 'HAPPY' // 可切換：HAPPY, SAD, SURPRISED, ANGRY, SLEEPY
    };

    // 切換表情的核心函式
    function setExpression(expName) {
        state.expression = expName;
        console.log("Current Expression:", state.expression);
    }

    // 繪製 BMO 臉部
    function drawBMO() {
        const w = canvas.width;
        const h = canvas.height;
        ctx.clearRect(0, 0, w, h);

        ctx.fillStyle = '#051d18';
        ctx.strokeStyle = '#051d18';
        ctx.lineWidth = w * 0.012;
        ctx.lineCap = 'round';

        const eyeRadius = w * 0.035;
        const eyeXOffset = w * 0.18;
        const eyeY = h * 0.42;

        // 1. 眼睛繪製
        if (state.isBlinking || state.expression === 'SLEEPY') {
            // 眨眼 / 睡覺 (一條橫線)
            ctx.beginPath();
            ctx.moveTo(w/2 - eyeXOffset - eyeRadius, eyeY);
            ctx.lineTo(w/2 - eyeXOffset + eyeRadius, eyeY);
            ctx.moveTo(w/2 + eyeXOffset - eyeRadius, eyeY);
            ctx.lineTo(w/2 + eyeXOffset + eyeRadius, eyeY);
            ctx.stroke();
        } else if (state.expression === 'ANGRY') {
            // 生氣的眼睛 (加上斜眉毛)
            ctx.beginPath();
            ctx.arc(w/2 - eyeXOffset, eyeY, eyeRadius, 0, Math.PI * 2);
            ctx.arc(w/2 + eyeXOffset, eyeY, eyeRadius, 0, Math.PI * 2);
            ctx.fill();

            // 左眉毛與右眉毛
            ctx.beginPath();
            ctx.moveTo(w/2 - eyeXOffset - eyeRadius, eyeY - eyeRadius * 1.5);
            ctx.lineTo(w/2 - eyeXOffset + eyeRadius, eyeY - eyeRadius * 0.5);
            ctx.moveTo(w/2 + eyeXOffset + eyeRadius, eyeY - eyeRadius * 1.5);
            ctx.lineTo(w/2 + eyeXOffset - eyeRadius, eyeY - eyeRadius * 0.5);
            ctx.stroke();
        } else {
            // 一般圓圓眼
            ctx.beginPath();
            ctx.arc(w/2 - eyeXOffset, eyeY, eyeRadius, 0, Math.PI * 2);
            ctx.arc(w/2 + eyeXOffset, eyeY, eyeRadius, 0, Math.PI * 2);
            ctx.fill();
        }

        // 2. 嘴巴繪製
        const mouthY = h * 0.58;
        const mouthWidth = w * 0.12;

        ctx.beginPath();
        switch (state.expression) {
            case 'HAPPY':
                ctx.arc(w/2, mouthY - h*0.02, mouthWidth, 0.1 * Math.PI, 0.9 * Math.PI);
                ctx.stroke();
                break;
            case 'SAD':
                ctx.arc(w/2, mouthY + h*0.05, mouthWidth, 1.1 * Math.PI, 1.9 * Math.PI);
                ctx.stroke();
                break;
            case 'SURPRISED':
                ctx.arc(w/2, mouthY, mouthWidth * 0.5, 0, Math.PI * 2);
                ctx.fill();
                break;
            case 'ANGRY':
                ctx.moveTo(w/2 - mouthWidth, mouthY);
                ctx.lineTo(w/2 + mouthWidth, mouthY);
                ctx.stroke();
                break;
            case 'SLEEPY':
                ctx.arc(w/2, mouthY, mouthWidth * 0.3, 0, Math.PI * 2);
                ctx.stroke();
                break;
        }

        requestAnimationFrame(drawBMO);
    }

    // 自動眨眼計時器
    function triggerBlink() {
        if (state.expression !== 'SLEEPY') {
            state.isBlinking = true;
            setTimeout(() => { state.isBlinking = false; }, 150);
        }
        setTimeout(triggerBlink, Math.random() * 3000 + 2000);
    }

    drawBMO();
    triggerBlink();

    // ==========================================
    // 改變表情的方式 (Ways to Change Expressions)
    // ==========================================

    // 【方式一：電腦鍵盤快捷鍵控制】
    window.addEventListener('keydown', (e) => {
        switch(e.key) {
            case '1': setExpression('HAPPY'); break;     // 按數字 1：開心
            case '2': setExpression('SAD'); break;       // 按數字 2：難過
            case '3': setExpression('SURPRISED'); break; // 按數字 3：驚訝
            case '4': setExpression('ANGRY'); break;     // 按數字 4：生氣
            case '5': setExpression('SLEEPY'); break;    // 按數字 5：睡覺
            case ' ': setExpression('HAPPY'); break;     // 空格鍵：恢復預設
        }
    });

    // 【方式二：點擊螢幕/觸控切換】
    // 每次點擊螢幕，自動輪播切換下一個表情
    const expressionsList = ['HAPPY', 'SURPRISED', 'SAD', 'ANGRY', 'SLEEPY'];
    let currentIndex = 0;
    canvas.addEventListener('click', () => {
        currentIndex = (currentIndex + 1) % expressionsList.length;
        setExpression(expressionsList[currentIndex]);
    });

    // 【方式三：供 ESP32-S3 / WebSocket 遠端控制呼叫】
    /*
    const ws = new WebSocket('ws://' + location.host + '/ws');
    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.expression) {
            setExpression(data.expression); // 接收 ESP32 傳來的指令 (例: {"expression":"ANGRY"})
        }
    };
    */
</script>
</body>
</html>
